<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            list-style: none;
        }
    </style>
</head>
<body > 
    {% include 'navbar.html' %}
    <div class="container">

            <div class="row mt-4">
                {% if courses%}
                    <div class="col-sm-6">
                        <h3 class="text-warning text-capitalize">today's courses</h3>
                        <ul class="w-100 border rounded p-4">
                            {%for course in courses %} 
                            <div class="d-flex align-items-center justify-content-between my-2">
                                <li>{{course.name}} - {{course.hour}}</li>
                                <a class="btn btn-primary" href='{{url_for("detect" , course_id=course.id)}}'>
                                    verify attendance
                                </a>
                            </div>
                            {%endfor%}
                        </ul>
                    </div>
                {% else%} 
                <div class="col-sm-6">no courses today</div>
                {% endif %}
        </div>
    </div>
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
