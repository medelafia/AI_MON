<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        * {
            list-style: none;
        }
    </style>
</head>
<body>
    <div class="container">
        {% if alert_text %}
        <div class="p-3">
            <div class="alert alert-{{alert_type}} alert-dismissible fade show" role="alert">
                <strong>{% if alert_type == "success" %}success!{%else%} error!{%endif%}</strong> 
                {{alert_text}}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </div>
        {% endif %}
        <div class="d-flex align-items-center justify-content-between w-100 py-2">
            <h1 class="text-center text-primary text-capitalize mt-3">Student Attendance System</h1>
            <div class="d-flex align-items-center justify-content-between">
                <a class="btn mx-1 "  href='{{url_for("index")}}'><i class="fa-solid fa-house"></i> home</a>
                <a class="btn mx-1 " href='{{url_for("show_persons")}}'><i class="fa-solid fa-user"></i>persons</a>
                <a class="btn mx-1" href='{{url_for("show_courses")}}'><i class="fa-solid fa-book"></i>courses</a>
                <a class="btn mx-1" href='{{url_for("retrain")}}'><i class="fa-solid fa-retweet"></i> retrain</a>
            </div>
        </div>
    </div>
</body>
</html>
