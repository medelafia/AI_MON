<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Add course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body class="d-flex justify-content-center">
    <div class="container w-50 py-5">
        <h1 class="text-primary">Add course</h1>
        <form action='{{url_for("addCourseToDb")}}' class="w-100"> 
            <div class="form-group">
                <label for="name">name</label>
                <input type="text" id="name" name="name" placeholder="enter the student name" class="form-control">  
            </div>
            <div class="form-group">
                <label for="day">day</label>
                <select name="day" id="day" class="form-select">
                    {%for weekday in weekdays%}
                        <option value="{{weekday}}">{{weekday|capitalize}}</option>
                    {%endfor%}
                </select>
            </div>
            <div class="form-group">
                <label for="hour">hour</label>

                <input type="time" id="hour" name="hour" placeholder="enter the time" class="form-control">  
            </div>
            <div class="form-group">
                <label for="teacher">course teacher</label>
                <select name="teacher_id" id="teacher_id" class="form-select">
                    {% for teacher in teachers %} 
                        <option value="{{teacher.id}}">{{teacher.name}}</option>
                    {% endfor %}
                </select>
            </div>
            <button class="btn btn-primary mt-5 w-100">submit</button>
        </form>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.0.1/js/bootstrap.min.js" integrity="sha512-EKWWs1ZcA2ZY9lbLISPz8aGR2+L7JVYqBAYTq5AXgBkSjRSuQEGqWx8R1zAX16KdXPaCjOCaKE8MCpU0wcHlHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

</body>
</html>
